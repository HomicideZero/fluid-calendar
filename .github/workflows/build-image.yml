name: Build and push image

on:
  push:
    branches: [deploy]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/production/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/homicidezero/fluid-calendar:deploy
            ghcr.io/homicidezero/fluid-calendar:${{ github.sha }}
          # Persist Docker layer cache in a dedicated ghcr tag so unchanged
          # layers (notably the slow `npm ci --legacy-peer-deps`) are restored
          # instead of rebuilt. The first build after this lands populates the
          # cache; later builds with unchanged deps skip the install entirely.
          cache-from: type=registry,ref=ghcr.io/homicidezero/fluid-calendar:buildcache
          cache-to: type=registry,ref=ghcr.io/homicidezero/fluid-calendar:buildcache,mode=max
